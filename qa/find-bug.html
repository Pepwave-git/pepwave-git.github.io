<script>const CASES=[{"id": "QA-001", "round": 0, "game": "Cyberpunk 2077", "img": "https://i.kym-cdn.com/entries/icons/original/000/036/103/Cyberpunk_2077_-_The_T_Pose_NPC_glitch_bug_0-30_screenshot.png", "category": "Animation", "priority": "Medium", "severity": "Low", "text": {"en": {"title": "NPC enters a T-pose during gameplay", "observed": "A visible NPC holds their arms horizontally in a T-pose rather than playing a natural character animation.", "expected": "NPCs should remain in context-appropriate idle, traversal or interaction animations.", "impact": "Breaks immersion and can indicate a failed animation state or rig update.", "caveat": "", "credit": "Know Your Meme / community footage", "hint": "Examine the NPC silhouette and arm pose."}, "es": {"title": "Un NPC adopta una pose en T durante la partida", "observed": "Un NPC mantiene los brazos horizontales en una pose en T en lugar de reproducir una animación natural.", "expected": "Los NPC deben usar animaciones de reposo, desplazamiento o interacción adecuadas al contexto.", "impact": "Rompe la inmersión y puede indicar un fallo en el estado de animación o la actualización del esqueleto.", "caveat": "", "credit": "Know Your Meme / grabación de la comunidad", "hint": "Examina la silueta del NPC y la posición de sus brazos."}}}, {"id": "QA-003", "round": 0, "game": "Cyberpunk 2077", "img": "https://cdn.mos.cms.futurecdn.net/jUKgEs9dzZeHdqjkyf2Drc-1920-80.jpg", "category": "Physics", "priority": "High", "severity": "Medium", "text": {"en": {"title": "Vehicle appears airborne and incorrectly oriented", "observed": "A vehicle is shown airborne or upside down in a manner inconsistent with normal road placement.", "expected": "Uncontrolled vehicles should obey expected collision, gravity and traversal states.", "impact": "Unexpected physics can disrupt traversal or mission interactions.", "caveat": "", "credit": "GamesRadar+ / reported gameplay glitch", "hint": "Inspect traffic positioning relative to the road."}, "es": {"title": "Un vehículo aparece en el aire con una orientación incorrecta", "observed": "Un vehículo aparece en el aire o invertido, fuera de su posición habitual en la carretera.", "expected": "Los vehículos deben respetar las reglas previstas de colisión, gravedad y desplazamiento.", "impact": "Un comportamiento físico inesperado puede interrumpir el recorrido o las interacciones de una misión.", "caveat": "", "credit": "GamesRadar+ / anomalía de una partida", "hint": "Compara la posición de los vehículos con la carretera."}}}, {"id": "QA-004", "round": 0, "game": "Cyberpunk 2077", "img": "https://cdn.mos.cms.futurecdn.net/v2/t%3A0%2Cl%3A0%2Ccw%3A1000%2Cch%3A562%2Cq%3A80%2Cw%3A1000/oYRi3CSVQKrAtwthcq5cA6.jpg", "category": "Character mesh", "priority": "Medium", "severity": "Medium", "text": {"en": {"title": "Third-person character mesh becomes distorted", "observed": "An out-of-camera player-character view exposes stretched, inconsistent body geometry.", "expected": "The character skeleton and mesh should maintain coherent anatomy across valid camera states.", "impact": "Visible deformation reveals animation/rigging edge cases; specific camera manipulation is not verified here.", "caveat": "", "credit": "PC Gamer / player footage", "hint": "Inspect the player model rather than the background."}, "es": {"title": "La malla del personaje se deforma en tercera persona", "observed": "Una vista del personaje fuera de la cámara habitual muestra una geometría corporal estirada e inconsistente.", "expected": "La malla y el esqueleto deben conservar una anatomía coherente en los estados de cámara válidos.", "impact": "La deformación muestra un caso límite de animación; aquí no se verificó la manipulación específica de la cámara.", "caveat": "", "credit": "PC Gamer / grabación de un jugador", "hint": "Examina el modelo del personaje, no el fondo."}}}, {"id": "QA-005", "round": 0, "game": "Cyberpunk 2077", "img": "https://ep01.epimg.net/verne/imagenes/2020/12/16/articulo/1608107833_970064_1608108496_noticia_normal.jpg", "category": "Character mesh", "priority": "Medium", "severity": "Medium", "text": {"en": {"title": "Character face fails to render normally", "observed": "A character face is visibly missing or incorrectly assembled in public glitch imagery.", "expected": "Face meshes, skin and features should render completely during dialogue and gameplay.", "impact": "Highly visible during close-up interactions and cinematics.", "caveat": "", "credit": "El País / Verne", "hint": "Focus on facial topology and skin rendering."}, "es": {"title": "El rostro del personaje no se renderiza correctamente", "observed": "El rostro aparece incompleto o ensamblado de forma incorrecta.", "expected": "La malla facial, la piel y los rasgos deben mostrarse completos durante los diálogos y la partida.", "impact": "El defecto resulta muy visible en primeros planos y escenas cinemáticas.", "caveat": "", "credit": "El País / Verne", "hint": "Examina la geometría del rostro y cómo se muestra la piel."}}}, {"id": "QA-006", "round": 1, "game": "The Elder Scrolls V: Skyrim", "img": "https://skyrim.annathepiper.org/files/2023/11/489830_20230119230339_1-1024x640.png", "category": "Physics", "priority": "Low", "severity": "Low", "text": {"en": {"title": "Horse is positioned unnaturally on steps", "observed": "A horse appears in an implausible posture or position against the staircase and surrounding terrain.", "expected": "Mount locomotion and collision should keep limbs and body aligned with traversable ground.", "impact": "Animal physics inconsistencies can affect navigation and create immersion-breaking states.", "caveat": "Screenshot may come from a modded Skyrim installation; cause unknown.", "credit": "Anna the Piper / gameplay blog", "hint": "Inspect the horse pose and terrain contact."}, "es": {"title": "Un caballo adopta una posición antinatural en las escaleras", "observed": "El caballo presenta una postura o una ubicación poco plausible respe function changeLanguage(next,notify=false){
  if(!['en','es'].includes(next)||next===language)return;
  saveDraft();language=next;applyStatic();render();byId('toast').style.display='none';
  if(infoKind)renderInfo();
  if(notify&&window.parent!==window)window.parent.postMessage({type:'find-bug-language',language},'*');
}
function evaluate(revealed){
  saveDraft();const draft=drafts[current().id];if(!revealed&&!draft.category){toast(T('categoryRequired'));return;}
  answers[current().id]={...draft,finished:true,revealed};save();render();
  byId('answerbox').scrollIntoView({behavior:'instant',block:'start'});
}
function markImage(event){
  if(event.target.closest('button')?.id==='skipImage'||byId('imageFallback').style.display==='flex')return;
  const bounds=byId('imageArea').getBoundingClientRect();
  const x=Math.max(0,Math.min(100,(event.clientX-bounds.left)/bounds.width*100)),y=Math.max(0,Math.min(100,(event.clientY-bounds.top)/bounds.height*100));
  drafts[current().id]??={};drafts[current().id].marker=[x,y];byId('marker').style.left=x+'%';byId('marker').style.top=y+'%';byId('marker').style.display='block';
}
function reportText(c){
  const r=text(c),a=answers[c.id];
  return `${c.id} — ${r.title}\n${T('game')}: ${gameName(c)}\n${T('category')}: ${categoryLabel(c.category)}\n${T('severity')}: ${levelLabel(c.severity)}\n${T('priority')}: ${levelLabel(c.priority)}\n\n${T('observed')}: ${r.observed}\n${T('expected')}: ${r.expected}\n${T('impact')}: ${r.impact}\n${T('repro')}: ${T('unverified')}\n${T('context')}: ${r.caveat||T('contextUnknown')}\n${T('credit')}: ${r.credit}\n\n${T('yourAnalysis')}:\n${T('category')}: ${a?.category?categoryLabel(a.category):T('notAttempted')}\n${T('title')}: ${a?.title||''}\n${T('notes')}: ${a?.notes||''}`;
}
async function copyReport(){
  const body=reportText(current());
  try{if(navigator.clipboard){await navigator.clipboard.writeText(body);toast(T('copied'));return;}}catch{}
  const area=document.createElement('textarea');area.value=body;area.style.cssText='position:fixed;opacity:0';document.body.append(area);area.select();
  const copied=document.execCommand('copy');area.remove();toast(T(copied?'copied':'copyFailed'));
}
function exportAnalysis(){
  const done=finished();if(!done.length){toast(T('finishToExport'));return;}
  const header=`# ${T('reportHeading')}\n\n${done.length}/${CASES.length} ${T('reviewed')} · ${correct().length}/${attempted().length} ${T('correctClassifications')}\n\n${T('reportMethod')}\n\n`;
  const content=header+done.map(c=>'## '+c.id+' — '+gameName(c)+'\n\n'+reportText(c)).join('\n\n---\n\n');
  if(window.parent!==window)window.parent.postMessage({type:'find-bug-export',content,language},'*');
  else{const url=URL.createObjectURL(new Blob([content],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Find-Bug-'+language+'.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  toast(T(done.length===1?'exportedOne':'exported',{count:done.length}));
}
function renderInfo(){
  byId('modalTitle').textContent=T(infoKind==='credits'?'creditsTitle':'howTitle');
  byId('modalContent').innerHTML=infoKind==='credits'?`<p>${esc(T('creditsIntro'))}</p><div class="sourcecards">${CASES.map(c=>`<article class="sourcecard"><strong>${c.id} — ${esc(gameName(c))}</strong><p>${esc(text(c).credit)}</p></article>`).join('')}</div>`:`<p>${esc(T('howIntro'))}</p><div class="introsteps">${[['stepObserve','stepObserveDesc'],['stepWrite','stepWriteDesc'],['stepCompare','stepCompareDesc']].map(([heading,desc])=>`<div><b>${esc(T(heading))}</b><p>${esc(T(desc))}</p></div>`).join('')}</div><p>${esc(T('scoringNote'))}</p><p>${esc(T('storageNote'))}</p><button class="btn ghost" id="restartBtn">${esc(T('restartBtn'))}</button>`;
}
function openInfo(kind){infoKind=kind;lastInfoFocus=document.activeElement;renderInfo();byId('modalBack').style.display='flex';byId('modalClose').focus();}
function closeInfo(){byId('modalBack').style.display='none';infoKind=null;lastInfoFocus?.focus();}
byId('labLanguage').onclick=()=>changeLanguage(language==='es'?'en':'es',true);
byId('roundButtons').onclick=event=>{const button=event.target.closest('[data-round]');if(!button)return;navigate(roundItems(Number(button.dataset.round))[0].i);byId('sidebar').classList.remove('open');};
byId('categoryButtons').onclick=event=>{const button=event.target.closest('[data-category]');if(!button)return;document.querySelectorAll('.cat').forEach(el=>{el.classList.toggle('selected',el===button);el.setAttribute('aria-pressed',String(el===button));});saveDraft();};
byId('thumbList').onclick=event=>{const button=event.target.closest('[data-case]');if(button)navigate(Number(button.dataset.case));};
byId('hintBtn').onclick=()=>{hintOpen=!hintOpen;byId('hintPanel').style.display=hintOpen?'block':'none';byId('hintBtn').textContent=T(hintOpen?'hideHint':'showHint');};
byId('imageArea').onclick=markImage;
byId('imageArea').onkeydown=event=>{if(!['Enter',' '].includes(event.key))return;event.preventDefault();const bounds=event.currentTarget.getBoundingClientRect();markImage({target:event.currentTarget,clientX:bounds.left+bounds.width/2,clientY:bounds.top+bounds.height/2});};
byId('evaluateBtn').onclick=()=>evaluate(false);byId('revealBtn').onclick=()=>evaluate(true);
byId('prevBtn').onclick=()=>navigate(index-1);for(const id of ['nextBtn','continueBtn','skipImage'])byId(id).onclick=()=>navigate(index+1);
byId('resetCaseBtn').onclick=()=>{if(!confirm(T('clearConfirm')))return;delete answers[current().id];delete drafts[current().id];save();render();toast(T('cleared'));};
byId('copyBtn').onclick=copyReport;byId('exportBtn').onclick=exportAnalysis;
byId('howBtn').onclick=()=>openInfo('how');byId('creditsBtn').onclick=()=>openInfo('credits');byId('modalClose').onclick=closeInfo;
byId('modalBack').onclick=event=>{if(event.target===byId('modalBack'))closeInfo();};
byId('modalContent').onclick=event=>{if(event.target.id!=='restartBtn'||!confirm(T('restartConfirm')))return;answers={};drafts={};save();render();closeInfo();toast(T('restarted'));};
byId('openMenu').onclick=()=>byId('sidebar').classList.toggle('open');
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'){event.preventDefault();if(infoKind)closeInfo();else if(byId('sidebar').classList.contains('open'))byId('sidebar').classList.remove('open');else if(window.parent!==window)window.parent.postMessage({type:'find-bug-close'},'*');}
  if(event.key==='Tab'&&infoKind){const controls=[...byId('modalBack').querySelectorAll('button')];const first=controls[0],last=controls.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
});
window.addEventListener('message',event=>{if(event.source===window.parent&&event.data?.type==='find-bug-language')changeLanguage(event.data.language);});
applyStatic();render();
</script></body></html>
